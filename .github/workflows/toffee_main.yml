name: Toffee Playlist Auto Sync

on:
  workflow_dispatch:
  schedule:
  - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: toffee-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Playlist
        run: |
          python -m pip install requests

          python - <<'PY'
          import requests

          url = (
            "https://raw.githubusercontent.com/"
            "sm-monirulislam/Toffee-Auto-Update/"
            "refs/heads/main/toffee_playlist.m3u"
          )

          r = requests.get(url, timeout=30)
          r.raise_for_status()

          content = r.text

          if not content.startswith("#EXTM3U"):
              raise RuntimeError("Invalid M3U playlist")

          if "#EXTINF" not in content:
              raise RuntimeError("No channels found")

          with open("toffee_playlist.m3u", "w", encoding="utf-8") as f:
              f.write(content)

          print("Playlist downloaded successfully")
          PY

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add toffee_playlist.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Auto update Toffee playlist"
            git push
          else
            echo "No playlist changes"
          fi
