
name: Toffee Playlist Auto Sync

on:
  workflow_dispatch:

  schedule:
    - cron: '11,31,51 * * * *'

permissions:
  contents: write

concurrency:
  group: toffee-sync
  cancel-in-progress: false

jobs:
  update:
    name: Download and Update Playlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Download latest Toffee playlist
      - name: Download Playlist
        run: |
          python -m pip install requests

          python - <<'PY'
          import requests

          url = (
              "https://raw.githubusercontent.com/"
              "sm-monirulislam/Toffee-Auto-Update/"
              "refs/heads/main/toffee_playlist.m3u"
          )

          print("Downloading Toffee playlist...")

          response = requests.get(
              url,
              timeout=60,
              headers={"User-Agent": "Ananta-OTT-Playlist-Sync"}
          )

          response.raise_for_status()
          content = response.text.lstrip("\ufeff")

          if not content.lstrip().startswith("#EXTM3U"):
              raise RuntimeError("Invalid M3U playlist")

          channel_count = content.count("#EXTINF")

          if channel_count < 1:
              raise RuntimeError("Playlist is empty")

          with open(
              "toffee_playlist.m3u",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(content)

          print(f"Download successful: {channel_count} channels")
          PY

      # Step 4: Upload playlist to Cloudflare KV
      - name: Upload Playlist to Cloudflare KV
        shell: bash
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_UPLOAD_TOKEN: ${{ secrets.CF_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$CF_WORKER_URL" || -z "$CF_UPLOAD_TOKEN" ]]; then
            echo "Missing Cloudflare GitHub Secrets."
            exit 1
          fi

          WORKER_URL="${CF_WORKER_URL%/}"

          echo "Uploading playlist to Cloudflare KV..."

          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            -X POST "${WORKER_URL}/upload" \
            -H "Authorization: Bearer ${CF_UPLOAD_TOKEN}" \
            -H "Content-Type: audio/x-mpegurl" \
            --data-binary @toffee_playlist.m3u

          echo "Cloudflare KV upload successful."

      # Step 5: Commit and push changes
      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add toffee_playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes detected."
          else
            git commit -m "Auto update Toffee playlist"
            git push origin HEAD:main
            echo "Playlist updated successfully."
          fi

      # Step 6: Final status
      - name: Sync Status
        if: success()
        run: |
          echo "Toffee Playlist and Cloudflare KV Sync completed successfully."
