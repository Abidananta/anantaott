name: Toffee Playlist Auto Sync

on:
  push:
    branches:
      - main
    paths:
      - toffee_playlist.m3u

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toffee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync M3U to JSON
        run: python scripts/sync_playlist.py

      - name: Commit JSON Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add toffee_data.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto sync Toffee playlist JSON"
            git push
          else
            echo "No JSON changes detected"
          fi
