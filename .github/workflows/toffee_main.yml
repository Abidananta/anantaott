name: Toffee Hybrid Auto Update

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - toffee_playlist.m3u

  schedule:
     - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: toffee-hybrid-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Playlist Sync
        run: python scripts/sync_playlist.py

      - name: Commit JSON Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add toffee_data.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto sync Toffee playlist"
            git push
          else
            echo "No JSON changes detected"
          fi
