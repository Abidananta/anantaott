name: Toffee Playlist Auto Sync

on:
  workflow_dispatch:

  schedule:
    # Runs every 20 minutes (UTC)
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: toffee-sync
  cancel-in-progress: false

jobs:
  update:
    name: Download and Update Playlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout your repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Download latest source playlist
      - name: Download Playlist
        run: |
          python -m pip install requests

          python - <<'PY'
          import requests
          import sys

          url = (
              "https://raw.githubusercontent.com/"
              "sm-monirulislam/Toffee-Auto-Update/"
              "refs/heads/main/toffee_playlist.m3u"
          )

          print("Downloading Toffee playlist...")

          response = requests.get(
              url,
              timeout=60,
              headers={"User-Agent": "Ananta-OTT-Playlist-Sync"}
          )

          response.raise_for_status()

          content = response.text.lstrip("\ufeff")

          if not content.lstrip().startswith("#EXTM3U"):
              raise RuntimeError("Invalid M3U playlist")

          if "#EXTINF" not in content:
              raise RuntimeError("No channels found")

          channel_count = content.count("#EXTINF")

          if channel_count < 1:
              raise RuntimeError("Playlist is empty")

          with open(
              "toffee_playlist.m3u",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(content)

          print(f"Download successful: {channel_count} channels")
          PY

      # Step 4: Commit and push changes
      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add toffee_playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes detected."
          else
            git commit -m "Auto update Toffee playlist"
            git push origin HEAD:main
            echo "Playlist updated successfully."
          fi

      # Step 5: Final status
      - name: Sync Status
        if: success()
        run: |
          echo "Toffee Playlist Sync completed successfully."
